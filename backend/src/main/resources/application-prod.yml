spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/netpulse}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:netpulse}
    password: ${DB_PASSWORD:netpulse}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
